services:
  db:
    image: mysql:8
    restart: always
    env_file:
      - ./database/.env
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
